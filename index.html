<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="El Disco Egipcio — una investigación contrarreloj en el Hotel Shepheard's, El Cairo, 1922." />
    <meta name="theme-color" content="#000000" />
    <title>El Disco Egipcio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="crt">
      <main id="game" aria-live="polite" hidden>
        <header id="hud">
          <div class="hud-status">
            <span id="hud-time">21 de noviembre, 09:00</span>
            <span id="hud-place">Recepción</span>
            <span id="hud-condition" hidden></span>
          </div>
          <nav class="hud-tools" aria-label="Herramientas">
            <button id="hud-map" type="button">Mapa</button>
            <button id="hud-case" type="button">Caso</button>
            <button id="hud-team" type="button">Equipo</button>
            <button id="hud-save" type="button">Guardar</button>
            <button id="hud-log" type="button">Historial</button>
            <button id="hud-audio" type="button" aria-pressed="false">Sonido</button>
          </nav>
        </header>

        <section id="objective" aria-label="Objetivo actual">
          <span>OBJETIVO</span>
          <p id="objective-text"></p>
        </section>

        <section id="scene" aria-label="Escena">
          <canvas id="art" width="320" height="152"></canvas>
          <figure id="portrait" hidden>
            <img id="portrait-img" alt="" />
            <figcaption id="portrait-name"></figcaption>
          </figure>
          <div id="scene-title"></div>
          <p id="scene-summary"></p>
        </section>

        <section id="log" aria-label="Narración" tabindex="0"></section>

        <nav id="choices" aria-label="Acciones disponibles"></nav>
      </main>

      <section id="front" class="front-screen" aria-live="polite">
        <div class="front-stage">
          <img id="front-image" alt="" />
          <div id="front-party" class="front-party" hidden></div>
          <div id="front-copy" class="front-copy"></div>
        </div>
        <nav id="front-actions" class="front-actions" aria-label="Menú principal"></nav>
      </section>

      <aside id="panel" hidden>
        <button id="panel-close" type="button" aria-label="Cerrar">×</button>
        <div id="panel-body"></div>
      </aside>
    </div>

    <noscript>
      <p style="color: #aaa; font-family: monospace; padding: 2rem">
        El Disco Egipcio necesita JavaScript. Actívalo y vuelve a cargar.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
