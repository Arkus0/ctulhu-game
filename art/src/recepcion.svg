<!--
  Recepción y hall de entrada del Shepheard's.

  Composición original. Columna monumental recortada a la izquierda para dar
  escala; la puerta de la terraza es la única fuente de luz y tira del ojo hacia
  el fondo; el mostrador entra en diagonal desde la derecha y trae la mirada de
  vuelta al libro de registro. El león encadenado descansa sobre la alfombra,
  en el paso de todo el mundo, como detalle secundario.
  Zonas tranquilas: inferior izquierda (alfombra) y superior derecha (artesonado).
-->
<svg width="1280" height="608" viewBox="0 0 1280 608" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555555"/>
      <stop offset="0.75" stop-color="#aaaaaa"/>
      <stop offset="1" stop-color="#aaaaaa"/>
    </linearGradient>
    <linearGradient id="fuste" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#555555"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aaaaaa"/>
    </linearGradient>
    <linearGradient id="fusteLejos" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aaaaaa"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="luzPuerta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffff55"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="tapiz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aa0000"/>
      <stop offset="0.55" stop-color="#aa0000"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="mostrador" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aa5500"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
  </defs>

  <!-- 1. Pared del fondo y artesonado. La franja superior derecha queda lisa. -->
  <rect x="0" y="0" width="1280" height="608" fill="url(#pared)"/>
  <rect x="0" y="0" width="1280" height="88" fill="#555555"/>
  <rect x="0" y="88" width="1280" height="8" fill="#000000" opacity="0.4"/>
  <g fill="#000000" opacity="0.3">
    <rect x="150" y="0" width="10" height="88"/>
    <rect x="430" y="0" width="10" height="88"/>
    <rect x="710" y="0" width="10" height="88"/>
  </g>

  <!-- 2. Puerta de la terraza: el foco de luz del hall. -->
  <path d="M470 150 q92 -96 184 0 L654 434 L470 434 Z" fill="url(#luzPuerta)"/>
  <rect x="554" y="112" width="16" height="322" fill="#aaaaaa" opacity="0.6"/>
  <rect x="470" y="292" width="184" height="10" fill="#aaaaaa" opacity="0.6"/>
  <!-- Recortadas contra la luz: la terraza sigue llena a las nueve. -->
  <g fill="#555555">
    <ellipse cx="512" cy="330" rx="19" ry="22"/>
    <path d="M490 358 q22 -13 44 0 l7 76 h-58 z"/>
    <ellipse cx="612" cy="338" rx="17" ry="20"/>
    <path d="M592 364 q20 -11 40 0 l5 70 h-50 z"/>
  </g>
  <!-- Marco de la puerta. -->
  <g fill="#aa5500">
    <path d="M452 150 q110 -114 220 0 l-18 12 q-92 -96 -184 0 z"/>
    <rect x="452" y="150" width="18" height="284"/>
    <rect x="654" y="150" width="18" height="284"/>
  </g>

  <!-- 3. Alfombra en fuga: del borde inferior hasta la puerta. -->
  <path d="M-60 608 L470 434 L654 434 L1340 608 Z" fill="url(#tapiz)"/>
  <g fill="#aa5500" opacity="0.7">
    <path d="M96 560 L500 452 L624 452 L1120 560 Z"/>
  </g>
  <g fill="#aa0000">
    <path d="M210 528 L520 464 L604 464 L980 528 Z"/>
  </g>
  <!-- Mármol a los lados de la alfombra. -->
  <g fill="#aaaaaa">
    <path d="M-60 608 L470 434 L400 434 L-200 608 Z"/>
    <path d="M1340 608 L654 434 L724 434 L1420 608 Z"/>
  </g>
  <g fill="#555555" opacity="0.45">
    <path d="M300 470 L120 608 L60 608 L250 470 Z"/>
    <path d="M860 470 L1050 608 L1112 608 L910 470 Z"/>
  </g>

  <!-- 4. Columna monumental recortada: da la escala del hall. -->
  <g>
    <rect x="40" y="96" width="180" height="440" fill="url(#fuste)"/>
    <rect x="8" y="52" width="244" height="46" fill="#ffffff"/>
    <rect x="8" y="40" width="244" height="14" fill="#aaaaaa"/>
    <rect x="16" y="536" width="228" height="40" fill="#aaaaaa"/>
    <rect x="16" y="576" width="228" height="32" fill="#555555"/>
    <!-- Vetas del falso mármol: yeso pintado, y se nota de cerca. -->
    <g fill="#aa5500" opacity="0.3">
      <path d="M74 96 l22 440 h-12 l-22 -440 z"/>
      <path d="M150 96 l14 440 h-9 l-14 -440 z"/>
      <path d="M196 96 l8 440 h-6 l-8 -440 z"/>
    </g>
  </g>

  <!-- 5. Columna del fondo, mucho más pequeña: profundidad. -->
  <g>
    <rect x="770" y="150" width="58" height="290" fill="url(#fusteLejos)"/>
    <rect x="756" y="128" width="86" height="24" fill="#ffffff"/>
    <rect x="756" y="440" width="86" height="20" fill="#aaaaaa"/>
  </g>

  <!-- 6. El león encadenado sobre la alfombra. Detalle secundario, pero
       inconfundible: melena, perfil y cadena hasta la basa de la columna. -->
  <g>
    <!-- Cuerpo tumbado. -->
    <ellipse cx="392" cy="536" rx="140" ry="46" fill="#aa5500"/>
    <path d="M300 560 q100 -26 200 -6 l-8 30 q-96 -14 -190 6 z" fill="#555555" opacity="0.5"/>
    <!-- Patas delanteras estiradas. -->
    <rect x="252" y="554" width="96" height="26" rx="12" fill="#aa5500"/>
    <rect x="238" y="566" width="40" height="18" rx="9" fill="#ffff55"/>
    <!-- Melena y cabeza en perfil. -->
    <ellipse cx="264" cy="490" rx="76" ry="70" fill="#aa5500"/>
    <ellipse cx="264" cy="490" rx="58" ry="52" fill="#ffff55" opacity="0.35"/>
    <path d="M196 452 q68 -60 136 0 q-30 -30 -68 -30 q-38 0 -68 30 z" fill="#555555" opacity="0.45"/>
    <ellipse cx="242" cy="500" rx="42" ry="36" fill="#ffff55"/>
    <rect x="220" y="486" width="14" height="10" fill="#000000"/>
    <rect x="252" y="486" width="14" height="10" fill="#000000"/>
    <path d="M214 518 q26 20 52 0 q-26 12 -52 0 z" fill="#000000"/>
    <rect x="234" y="506" width="16" height="10" fill="#aa5500"/>
    <!-- Cola. -->
    <path d="M520 540 q66 6 84 44" stroke="#aa5500" stroke-width="18" fill="none"/>
    <ellipse cx="606" cy="588" rx="18" ry="14" fill="#555555"/>
    <!-- Cadena hasta la basa de la columna. -->
    <g fill="#555555">
      <rect x="196" y="536" width="16" height="9"/><rect x="172" y="546" width="16" height="9"/>
      <rect x="148" y="556" width="16" height="9"/><rect x="124" y="566" width="16" height="9"/>
      <rect x="100" y="574" width="16" height="9"/>
    </g>
  </g>

  <!-- 7. Mostrador en diagonal desde la derecha, con Clinton detrás. -->
  <g>
    <!-- Casillero de llaves. -->
    <rect x="900" y="140" width="380" height="240" fill="#aa5500"/>
    <rect x="900" y="140" width="380" height="14" fill="#ffff55" opacity="0.5"/>
    <g fill="#000000" opacity="0.55">
      <rect x="920" y="166" width="76" height="46"/><rect x="1012" y="166" width="76" height="46"/>
      <rect x="1104" y="166" width="76" height="46"/><rect x="1196" y="166" width="76" height="46"/>
      <rect x="920" y="230" width="76" height="46"/><rect x="1012" y="230" width="76" height="46"/>
      <rect x="1104" y="230" width="76" height="46"/><rect x="1196" y="230" width="76" height="46"/>
      <rect x="920" y="294" width="76" height="46"/><rect x="1012" y="294" width="76" height="46"/>
      <rect x="1104" y="294" width="76" height="46"/><rect x="1196" y="294" width="76" height="46"/>
    </g>
    <g fill="#ffff55">
      <rect x="948" y="188" width="12" height="20"/><rect x="1132" y="252" width="12" height="20"/>
      <rect x="1224" y="188" width="12" height="20"/><rect x="1040" y="316" width="12" height="20"/>
    </g>

    <!-- Clinton, iluminado desde la puerta: media cara clara, media en sombra. -->
    <ellipse cx="1010" cy="392" rx="40" ry="44" fill="#aa5500"/>
    <path d="M1010 348 a40 44 0 0 0 0 88 z" fill="#ffff55" opacity="0.45"/>
    <path d="M974 372 q36 -30 72 -6 l-2 -22 q-34 -20 -70 4 z" fill="#000000"/>
    <!-- La calva de la bala, junto a la oreja izquierda. -->
    <ellipse cx="1044" cy="374" rx="12" ry="9" fill="#aa5500"/>
    <rect x="990" y="380" width="10" height="8" fill="#000000"/>
    <rect x="1022" y="380" width="10" height="8" fill="#000000"/>
    <path d="M960 436 q50 -26 100 0 l16 62 h-132 z" fill="#000000"/>
    <path d="M996 436 h30 l-2 62 h-26 z" fill="#ffffff"/>
    <rect x="1004" y="446" width="14" height="34" fill="#aa0000"/>

    <!-- Tablero del mostrador, en diagonal hacia el espectador. -->
    <path d="M746 498 L1280 430 L1280 470 L746 546 Z" fill="#ffff55"/>
    <path d="M746 546 L1280 470 L1280 608 L746 608 Z" fill="url(#mostrador)"/>
    <g fill="#000000" opacity="0.3">
      <path d="M746 578 L1280 512 L1280 526 L746 592 Z"/>
    </g>
    <!-- El libro de registro, abierto justo bajo la luz. -->
    <path d="M842 508 L986 488 L1000 518 L856 540 Z" fill="#ffffff"/>
    <g fill="#aaaaaa">
      <rect x="862" y="508" width="106" height="5" transform="rotate(-8 862 508)"/>
      <rect x="868" y="521" width="96" height="5" transform="rotate(-8 868 521)"/>
    </g>
    <rect x="916" y="486" width="7" height="38" fill="#555555" transform="rotate(-8 916 486)"/>
    <!-- Campanilla de bronce. -->
    <path d="M1074 476 q26 -34 52 0 z" fill="#ffff55"/>
    <ellipse cx="1100" cy="478" rx="28" ry="8" fill="#ffff55"/>
    <rect x="1096" y="452" width="8" height="12" fill="#aa5500"/>
  </g>

  <!-- 8. Huésped de espaldas en la alfombra, escala humana junto al mostrador. -->
  <g>
    <ellipse cx="716" cy="392" rx="26" ry="28" fill="#000000"/>
    <rect x="690" y="366" width="52" height="14" fill="#000000"/>
    <path d="M682 422 q34 -18 68 0 l14 110 h-96 z" fill="#0000aa"/>
    <rect x="766" y="486" width="44" height="38" fill="#aa5500"/>
    <rect x="766" y="478" width="44" height="10" fill="#000000"/>
  </g>

  <!-- 9. Ventilador de techo. -->
  <g fill="#555555">
    <rect x="592" y="96" width="8" height="34"/>
    <ellipse cx="596" cy="134" rx="14" ry="7"/>
    <path d="M596 134 L466 124 L466 136 L596 142 Z"/>
    <path d="M596 134 L726 126 L726 138 L596 142 Z"/>
  </g>
</svg>
