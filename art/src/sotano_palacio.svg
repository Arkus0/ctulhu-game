<!--
  Salón de Alí Bey al-Kabir, 1750. Bajo las cocinas del Shepheard's.

  Composición original. Prueba de legibilidad del subsuelo: nada de mancha
  negra. El negro puro se reserva para lo que de verdad es un agujero —el pozo
  y la boca del corredor sur—, y la piedra en penumbra se resuelve con grises y
  azules tramados. Cuatro lecturas obligatorias:
    suelo (la piedra iluminada por la linterna),
    salida (la escalinata del este, con luz fría arriba),
    peligro (el pozo abierto, sin brocal, en primer término),
    objeto (el armario de ébano, a la derecha, en el foco cálido).
  Zonas tranquilas: inferior izquierda (losa) y superior derecha (penumbra).
-->
<svg width="1280" height="608" viewBox="0 0 1280 608" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="farol" cx="0.5" cy="0.52" r="0.62">
      <stop offset="0" stop-color="#ffff55"/>
      <stop offset="0.35" stop-color="#aa5500"/>
      <stop offset="0.72" stop-color="#555555"/>
      <stop offset="1" stop-color="#0000aa"/>
    </radialGradient>
    <linearGradient id="muroFrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.45" stop-color="#0000aa"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="losaSotano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555555"/>
      <stop offset="0.5" stop-color="#aa5500"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="escalera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55ffff"/>
      <stop offset="0.4" stop-color="#00aaaa"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="ebano" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#555555"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- 1. Muro del fondo: piedra fría, tramada, nunca negra del todo. -->
  <rect x="0" y="0" width="1280" height="608" fill="url(#muroFrio)"/>
  <!-- Sillares: la textura que impide que la pared sea una superficie muerta. -->
  <g stroke="#000000" stroke-width="3" opacity="0.5">
    <line x1="0" y1="92" x2="1280" y2="92"/>
    <line x1="0" y1="164" x2="1280" y2="164"/>
    <line x1="0" y1="236" x2="1280" y2="236"/>
    <line x1="0" y1="308" x2="1280" y2="308"/>
    <line x1="0" y1="380" x2="1280" y2="380"/>
    <line x1="120" y1="92" x2="120" y2="164"/><line x1="400" y1="92" x2="400" y2="164"/>
    <line x1="680" y1="92" x2="680" y2="164"/><line x1="960" y1="92" x2="960" y2="164"/>
    <line x1="260" y1="164" x2="260" y2="236"/><line x1="540" y1="164" x2="540" y2="236"/>
    <line x1="820" y1="164" x2="820" y2="236"/><line x1="1100" y1="164" x2="1100" y2="236"/>
    <line x1="120" y1="236" x2="120" y2="308"/><line x1="400" y1="236" x2="400" y2="308"/>
    <line x1="680" y1="236" x2="680" y2="308"/><line x1="960" y1="236" x2="960" y2="308"/>
  </g>

  <!-- 2. Halo del farol: define qué se ve y qué se adivina. -->
  <ellipse cx="600" cy="420" rx="620" ry="330" fill="url(#farol)" opacity="0.62"/>

  <!-- 3. Suelo de losa, con el charco de luz del farol en el centro. -->
  <rect x="0" y="404" width="1280" height="204" fill="url(#losaSotano)"/>
  <g stroke="#000000" stroke-width="3" opacity="0.45">
    <line x1="0" y1="446" x2="1280" y2="446"/>
    <line x1="0" y1="502" x2="1280" y2="502"/>
    <line x1="0" y1="566" x2="1280" y2="566"/>
    <line x1="196" y1="404" x2="150" y2="608"/>
    <line x1="470" y1="404" x2="450" y2="608"/>
    <line x1="744" y1="404" x2="760" y2="608"/>
    <line x1="1018" y1="404" x2="1074" y2="608"/>
  </g>

  <!-- 4. SALIDA. Escalinata del este, al fondo izquierda, con luz fría arriba. -->
  <g>
    <path d="M60 404 L300 404 L300 210 L60 250 Z" fill="#000000" opacity="0.55"/>
    <g fill="url(#escalera)">
      <path d="M84 396 L288 396 L288 372 L84 378 Z"/>
      <path d="M96 368 L288 368 L288 344 L96 350 Z"/>
      <path d="M108 340 L288 340 L288 316 L108 322 Z"/>
      <path d="M120 312 L288 312 L288 288 L120 294 Z"/>
      <path d="M132 284 L288 284 L288 260 L132 266 Z"/>
      <path d="M144 256 L288 256 L288 232 L144 238 Z"/>
    </g>
    <!-- El resplandor de la cocina, veinte metros más arriba. -->
    <path d="M144 238 L288 232 L288 196 L156 208 Z" fill="#55ffff" opacity="0.5"/>
  </g>

  <!-- 5. Columnas papiriformes de capitel cerrado, la entrada norte. -->
  <g>
    <!-- Columna izquierda, en penumbra. -->
    <rect x="336" y="120" width="86" height="300" fill="#555555"/>
    <path d="M336 120 q43 -62 86 0 z" fill="#aa5500"/>
    <rect x="330" y="112" width="98" height="16" fill="#aa5500"/>
    <rect x="326" y="416" width="106" height="24" fill="#555555"/>
    <g fill="#000000" opacity="0.4">
      <rect x="336" y="128" width="12" height="288"/>
      <rect x="366" y="128" width="10" height="288"/>
      <rect x="394" y="128" width="12" height="288"/>
    </g>
    <!-- Columna derecha, la que recibe el farol de lleno. -->
    <rect x="880" y="104" width="104" height="316" fill="#aa5500"/>
    <path d="M880 104 q52 -70 104 0 z" fill="#ffff55"/>
    <rect x="872" y="96" width="120" height="18" fill="#ffff55"/>
    <rect x="866" y="416" width="132" height="26" fill="#aa5500"/>
    <g fill="#000000" opacity="0.35">
      <rect x="884" y="114" width="14" height="302"/>
      <rect x="920" y="114" width="12" height="302"/>
      <rect x="954" y="114" width="14" height="302"/>
    </g>
    <g fill="#ffff55" opacity="0.35">
      <rect x="902" y="114" width="8" height="302"/>
      <rect x="938" y="114" width="8" height="302"/>
    </g>
  </g>

  <!-- 6. Boca del corredor sur: negro puro, porque es un agujero de verdad. -->
  <path d="M1040 404 L1240 404 L1240 168 q-100 -56 -200 0 Z" fill="#000000"/>
  <path d="M1040 404 L1240 404 L1240 168 q-100 -56 -200 0 Z" fill="none" stroke="#555555" stroke-width="8"/>
  <!-- Lo que se adivina al fondo del corredor: nada, y eso es lo inquietante. -->
  <ellipse cx="1140" cy="330" rx="46" ry="34" fill="#0000aa" opacity="0.35"/>

  <!-- 7. Toneles sellados, a la izquierda. -->
  <g>
    <ellipse cx="196" cy="448" rx="56" ry="18" fill="#aa5500"/>
    <path d="M140 448 v-96 q56 -22 112 0 v96 q-56 22 -112 0 z" fill="#aa5500"/>
    <g fill="#000000" opacity="0.45">
      <rect x="140" y="376" width="112" height="10"/>
      <rect x="140" y="416" width="112" height="10"/>
    </g>
    <ellipse cx="196" cy="352" rx="56" ry="18" fill="#555555"/>
    <ellipse cx="300" cy="462" rx="48" ry="15" fill="#555555"/>
    <path d="M252 462 v-80 q48 -18 96 0 v80 q-48 18 -96 0 z" fill="#555555"/>
    <ellipse cx="300" cy="382" rx="48" ry="15" fill="#000000" opacity="0.5"/>
  </g>

  <!-- 8. Mesas damasquinadas, una más alta que la otra. -->
  <g>
    <rect x="516" y="386" width="150" height="12" fill="#aa5500"/>
    <rect x="524" y="398" width="12" height="60" fill="#555555"/>
    <rect x="646" y="398" width="12" height="60" fill="#555555"/>
    <g fill="#ffff55" opacity="0.6">
      <rect x="540" y="374" width="26" height="12"/>
      <rect x="600" y="376" width="20" height="10"/>
    </g>
    <rect x="690" y="416" width="120" height="10" fill="#555555"/>
    <rect x="696" y="426" width="10" height="46" fill="#555555"/>
    <rect x="794" y="426" width="10" height="46" fill="#555555"/>
  </g>

  <!-- 9. OBJETO. El armario bajo de ébano, con el cuarto departamento vacío. -->
  <g>
    <rect x="1000" y="300" width="252" height="150" fill="url(#ebano)"/>
    <rect x="1000" y="292" width="252" height="14" fill="#aa5500"/>
    <g stroke="#aa5500" stroke-width="4" fill="none">
      <rect x="1014" y="312" width="54" height="126"/>
      <rect x="1076" y="312" width="54" height="126"/>
      <rect x="1138" y="312" width="54" height="126"/>
      <rect x="1200" y="312" width="42" height="126"/>
    </g>
    <!-- Los tres primeros con sus cajones; el cuarto, vacío. -->
    <g fill="#555555">
      <rect x="1020" y="320" width="42" height="26"/><rect x="1020" y="352" width="42" height="26"/>
      <rect x="1020" y="384" width="42" height="26"/>
      <rect x="1082" y="320" width="42" height="26"/><rect x="1082" y="352" width="42" height="26"/>
      <rect x="1082" y="384" width="42" height="26"/>
      <rect x="1144" y="320" width="42" height="26"/><rect x="1144" y="352" width="42" height="26"/>
    </g>
    <rect x="1206" y="318" width="30" height="112" fill="#000000"/>
    <!-- El reflejo del farol en la marquetería: aquí hay algo que mirar. -->
    <g fill="#ffff55" opacity="0.5">
      <rect x="1014" y="306" width="230" height="6"/>
      <rect x="1206" y="318" width="30" height="5"/>
    </g>
  </g>

  <!-- 10. PELIGRO. El pozo: sin brocal, y no se ve hasta que es tarde. -->
  <g>
    <ellipse cx="560" cy="556" rx="184" ry="52" fill="#555555"/>
    <ellipse cx="560" cy="552" rx="170" ry="44" fill="#000000"/>
    <!-- Un brillo mínimo de líquido, catorce metros más abajo. -->
    <ellipse cx="548" cy="560" rx="44" ry="12" fill="#00aa00" opacity="0.35"/>
    <ellipse cx="590" cy="546" rx="18" ry="6" fill="#00aa00" opacity="0.25"/>
    <!-- Losa levantada en el borde: la pista de que el suelo se acaba. -->
    <path d="M376 566 l60 -22 l30 16 l-58 26 z" fill="#aa5500"/>
    <path d="M700 540 l64 12 l-14 22 l-62 -14 z" fill="#aa5500"/>
  </g>

  <!-- 11. El farol en el suelo, junto al pozo: fuente de luz visible. -->
  <g>
    <rect x="778" y="512" width="10" height="40" fill="#555555"/>
    <rect x="752" y="470" width="62" height="46" fill="#ffff55"/>
    <rect x="752" y="470" width="62" height="46" fill="none" stroke="#555555" stroke-width="6"/>
    <path d="M762 462 h42 l-6 -16 h-30 z" fill="#555555"/>
    <ellipse cx="783" cy="556" rx="96" ry="22" fill="#ffff55" opacity="0.3"/>
  </g>
</svg>
